<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Year 4 Study Guide</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">Year 4 Study Guide</a>
</header>
<main class="container">
  <h1>Study Notes &amp; Practice</h1>
  <p>Browse notes by subject, then practice with flashcards, quizzes, or exam-style short answer questions.</p>
  <div class="subject-grid" id="subject-grid"></div>
</main>
<script src="assets/app.js"></script>
<script>
  const grid = document.getElementById("subject-grid");
  grid.innerHTML = SUBJECTS.map(
    (s) => `
    <a class="subject-card" href="subject.html?s=${s.id}">
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
    </a>`
  ).join("");
  initHeader();
</script>
</body>
</html>
