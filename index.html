<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Year 4 Study Guide</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" class="brand-logo" />Year 4 Study Guide</a>
</header>
<main class="container">
  <section class="hero">
    <h1>Everything you need, <span class="hero-highlight">in one place.</span></h1>
    <p>Notes, flashcards, quizzes, and exam-style short answer practice — built from your full-year combined notes.</p>
  </section>
  <div class="subject-grid" id="subject-grid"></div>
</main>
<script src="assets/app.js"></script>
<script>
  const grid = document.getElementById("subject-grid");
  grid.innerHTML = SUBJECTS.map(
    (s) => `
    <a class="subject-card" href="subject.html?s=${s.id}" style="--card-accent: ${s.color}">
      <span class="subject-icon">${s.icon}</span>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <span class="card-arrow">Explore →</span>
    </a>`
  ).join("");
  initHeader();
</script>
</body>
</html>
